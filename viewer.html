<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redline</title>
<link rel="stylesheet" href="/static/redline.css">
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/mermaid.min.js"></script>
<script src="/static/rail.js"></script>
<style>
html { scroll-behavior:smooth; }
body {
  background:var(--paper); color:var(--ink);
  font:17px/1.65 Charter, Georgia, serif;
}

main { display:flex; gap:0; align-items:flex-start; }
#doc {
  flex:1; min-width:0; max-width:780px;
  padding:40px 48px 120px; margin:0 auto;
}
#doc h1 { font-size:32px; line-height:1.2; margin:8px 0 16px; }
#doc h2 { font-size:23px; margin:40px 0 12px; padding-top:8px; }
#doc h3 { font-size:18px; margin:28px 0 8px; }
#doc p, #doc ul, #doc ol { margin:0 0 14px; }
#doc li { margin:4px 0; }
#doc code {
  font:.85em ui-monospace, "SF Mono", Menlo, monospace;
  background:var(--accent-soft); padding:1px 5px; border-radius:4px;
}
#doc pre {
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:14px 16px; overflow-x:auto; margin:0 0 16px;
}
#doc pre code { background:none; padding:0; }
#doc table { border-collapse:collapse; margin:0 0 16px; width:100%; font-size:15px; }
#doc th, #doc td { border:1px solid var(--line); padding:7px 11px; text-align:left; }
#doc th { font-family:-apple-system, sans-serif; font-size:12px;
          text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
#doc blockquote { border-left:3px solid var(--accent); margin:0 0 14px;
                  padding:2px 0 2px 16px; color:var(--muted); }
#doc hr { border:0; border-top:1px solid var(--line); margin:32px 0; }
#doc input[type=checkbox] { accent-color:var(--accent); margin-right:6px; }
.mermaid-wrap { background:var(--surface); border:1px solid var(--line);
                border-radius:8px; padding:18px; overflow-x:auto; margin:0 0 16px;
                text-align:center; }
.mermaid-wrap svg { max-width:100%; height:auto; }

mark.fb { border-radius:3px; padding:0 1px; cursor:pointer;
          background:var(--hl); color:inherit;
          border-bottom:2px solid rgba(217,119,6,.75); }
mark.fb.resolved { background:var(--hl-resolved);
                   border-bottom-color:rgba(34,197,94,.6); }
mark.fb.answered { background:var(--hl-answered);
                   border-bottom-color:rgba(220,38,38,.7); }
mark.fb.flash { outline:2px solid var(--accent); }

#seltool {
  position:absolute; z-index:30; display:flex; gap:1px;
  background:var(--ink); border-radius:8px; box-shadow:var(--shadow);
  overflow:hidden;
}
#seltool button {
  background:none; border:0; color:var(--paper); padding:8px 13px;
  font:13px -apple-system, sans-serif; cursor:pointer;
  display:flex; align-items:center; gap:6px;
}
#seltool button svg { width:14px; height:14px; }
#seltool button:hover { background:rgba(255,255,255,.14); }

@media (max-width: 980px) {
  main { flex-direction:column; }
  #doc { padding:24px 20px 60px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }
</style>
</head>
<body>

<header>
  <a href="/">Redline</a><span style="color:var(--muted)">/</span>
  <span id="title">&hellip;</span>
  <select class="pill version" id="version"><option value="__live__" selected>v&hellip; (live)</option></select>
  <span class="pill" id="pstatus"></span>
  <a class="pill" id="protolink" hidden title="Open the prototype for this plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>prototype</a>
  <button class="pill" id="download" title="Download this version as a .md file">&#8595; .md</button>
  <span id="live"><span class="dot"></span><span id="livetext">connecting</span></span>
</header>

<div id="histbar">
  <span id="histtext"></span>
  <button id="histrestore">Restore this version</button>
  <button id="histback">Back to live</button>
</div>

<main>
  <article id="doc"></article>
  <aside id="rail"></aside>
</main>

<div id="seltool" hidden>
  <button id="act-comment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg>Comment</button>
  <button id="act-edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>Suggest edit</button>
</div>

<script>
const slug = location.pathname.split('/').filter(Boolean).slice(1).map(decodeURIComponent).join('/');
const docEl = document.getElementById('doc');
const seltool = document.getElementById('seltool');
const {api, toast} = Redline;
const state = { plan:null, sel:null, history:[], historySha:null };

function setLive(on) {
  const el = document.getElementById('live');
  el.classList.toggle('on', on);
  document.getElementById('livetext').textContent = on ? 'live' : 'server offline';
}

const rail = Redline.mount({
  slug,
  rail: document.getElementById('rail'),
  hint: 'Select any passage in the plan to comment on it or suggest an edit. ' +
        'Drafts collect here; send them to Claude in one batch.',
  actions: [{label: '+ General note (no selection)', onClick: () => {
    state.sel = {quote:'', section:'', prefix:'', suffix:'', rect:null};
    openForm('comment');
  }}],
  onCardClick: item => {
    const mark = docEl.querySelector('mark.fb[data-id="' + CSS.escape(item.id) + '"]');
    if (mark) {
      mark.scrollIntoView({block:'center'});
      mark.classList.add('flash');
      setTimeout(() => mark.classList.remove('flash'), 1200);
    }
  },
  refresh: () => refresh(),
});

/* ---------- rendering ---------- */

function renderPlan(plan) {
  document.getElementById('title').textContent = plan.meta.title || slug;
  document.title = (plan.meta.title || slug) + ' · Redline';
  const vsel = document.getElementById('version');
  let live = vsel.querySelector('option[value="__live__"]');
  if (!live) {
    live = document.createElement('option');
    live.value = '__live__';
    vsel.prepend(live);
  }
  live.textContent = 'v' + (plan.meta.version || '1') + ' (live)';
  vsel.value = '__live__';
  document.getElementById('pstatus').textContent = plan.meta.status || 'draft';
  const pl = document.getElementById('protolink');
  pl.hidden = !plan.meta.prototype;
  if (plan.meta.prototype) pl.href = '/proto/' + plan.meta.prototype;
  renderMarkdownBody(plan.markdown);
}

function renderMarkdownBody(markdown) {
  docEl.innerHTML = marked.parse(markdown);
  docEl.querySelectorAll('pre > code.language-mermaid').forEach(code => {
    const wrap = document.createElement('div');
    wrap.className = 'mermaid-wrap';
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    wrap.appendChild(div);
    code.parentElement.replaceWith(wrap);
  });
  const nodes = docEl.querySelectorAll('.mermaid');
  if (nodes.length) {
    try { mermaid.run({nodes}).catch(() => {}); } catch (e) {}
  }
}

/* ---------- version history ---------- */

async function loadHistory() {
  let data;
  try { data = await api('/api/history/' + slug); } catch (e) { return; }
  state.history = data.commits || [];
  const vsel = document.getElementById('version');
  const keep = vsel.value;
  vsel.querySelectorAll('option:not([value="__live__"])').forEach(o => o.remove());
  for (const c of state.history) {
    const opt = document.createElement('option');
    opt.value = c.sha;
    const label = c.version ? ('v' + c.version) : c.short;
    opt.textContent = label + ' · ' + c.date;
    vsel.appendChild(opt);
  }
  vsel.value = keep && [...vsel.options].some(o => o.value === keep) ? keep : '__live__';
}

async function enterHistory(sha) {
  let data;
  try { data = await api('/api/history-at/' + sha + '/' + slug); }
  catch (e) { toast('Could not load that version'); document.getElementById('version').value = '__live__'; return; }
  state.historySha = sha;
  clearHighlights();
  rail.setDisabled(true);
  const c = state.history.find(h => h.sha === sha);
  const bar = document.getElementById('histbar');
  bar.classList.add('on');
  document.getElementById('histtext').textContent =
    'Read only · ' + (data.meta.title || slug) + ' ' +
    (c && c.version ? 'v' + c.version : (c ? c.short : sha.slice(0, 7))) +
    (c ? ' · ' + c.date : '') + (c ? ' · ' + c.subject : '');
  document.getElementById('pstatus').textContent = data.meta.status || '';
  renderMarkdownBody(data.markdown);
}

function exitHistory() {
  state.historySha = null;
  document.getElementById('histbar').classList.remove('on');
  rail.setDisabled(false);
  document.getElementById('version').value = '__live__';
  state.plan = null; // force a full re-render on next refresh
  refresh();
}

document.getElementById('version').addEventListener('change', e => {
  const v = e.target.value;
  if (v === '__live__') exitHistory();
  else enterHistory(v);
});
document.getElementById('histback').addEventListener('click', exitHistory);

document.getElementById('download').addEventListener('click', () => {
  window.location.href = state.historySha
    ? '/raw-at/' + state.historySha + '/' + slug
    : '/raw/' + slug;
});

document.getElementById('histrestore').addEventListener('click', async () => {
  if (!state.historySha) return;
  if (!confirm('Restore this version as the new latest? This adds it as a new version; nothing is lost.')) return;
  try {
    const r = await api('/api/restore/' + state.historySha + '/' + slug, {});
    toast('Restored as v' + r.version);
    exitHistory();
    loadHistory();
  } catch (e) { toast('Restore failed'); }
});

function clearHighlights() {
  docEl.querySelectorAll('mark.fb').forEach(m => {
    const parent = m.parentNode;
    while (m.firstChild) parent.insertBefore(m.firstChild, m);
    m.remove();
    parent.normalize();
  });
}

function applyHighlights() {
  clearHighlights();
  for (const item of rail.items()) {
    const q = (item.quote || '').trim();
    if (q.length < 3 || q.length > 500) continue;
    const walker = document.createTreeWalker(docEl, NodeFilter.SHOW_TEXT, {
      acceptNode: n => n.parentElement.closest('.mermaid-wrap, mark.fb')
        ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
    });
    let node;
    while ((node = walker.nextNode())) {
      const idx = node.data.indexOf(q);
      if (idx < 0) continue;
      const range = document.createRange();
      range.setStart(node, idx);
      range.setEnd(node, idx + q.length);
      const mark = document.createElement('mark');
      mark.className = 'fb' + (item.status === 'resolved' ? ' resolved'
                             : item.status === 'answered' ? ' answered' : '');
      mark.dataset.id = item.id;
      try { range.surroundContents(mark); } catch (e) {}
      break;
    }
  }
}

/* ---------- polling ---------- */

async function refresh() {
  if (state.historySha) return;
  let plan, fb;
  try {
    [plan, fb] = await Promise.all([api('/api/plan/' + slug), api('/api/feedback/' + slug)]);
  } catch (e) { setLive(false); return; }
  setLive(true);
  if (rail.busy()) return;
  const planChanged = !state.plan || state.plan.mtime !== plan.mtime;
  if (planChanged) {
    const y = window.scrollY;
    const oldV = state.plan && state.plan.meta.version;
    renderPlan(plan);
    window.scrollTo(0, y);
    if (oldV && oldV !== plan.meta.version) {
      toast('Claude updated the plan to v' + plan.meta.version);
      loadHistory();
    }
    state.plan = plan;
  }
  const fbChanged = rail.setFeedback(fb);
  if (planChanged || fbChanged) applyHighlights();
}

/* ---------- selection & forms ---------- */

function nearestHeading(range) {
  let best = '';
  for (const h of docEl.querySelectorAll('h1,h2,h3,h4')) {
    const pos = h.compareDocumentPosition(range.startContainer);
    if (pos & Node.DOCUMENT_POSITION_FOLLOWING) best = h.textContent;
  }
  return best.trim();
}

document.addEventListener('mouseup', e => {
  if (rail.isFormOpen() || seltool.contains(e.target) ||
      document.getElementById('popover').contains(e.target)) return;
  setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) { seltool.hidden = true; return; }
    const text = sel.toString().trim();
    if (text.length < 3) { seltool.hidden = true; return; }
    const range = sel.getRangeAt(0);
    if (!docEl.contains(range.commonAncestorContainer)) { seltool.hidden = true; return; }
    const full = docEl.innerText;
    const at = full.indexOf(text);
    const r = range.getBoundingClientRect();
    state.sel = {
      quote: text,
      section: nearestHeading(range),
      prefix: at > 0 ? full.slice(Math.max(0, at - 40), at) : '',
      suffix: at >= 0 ? full.slice(at + text.length, at + text.length + 40) : '',
      rect: {left: r.left + scrollX, right: r.right + scrollX,
             top: r.top + scrollY, bottom: r.bottom + scrollY}
    };
    seltool.hidden = false;
    seltool.style.left = Math.max(8, Math.min(
      state.sel.rect.left, scrollX + innerWidth - seltool.offsetWidth - 16)) + 'px';
    seltool.style.top = (state.sel.rect.top - seltool.offsetHeight - 8) + 'px';
  }, 10);
});

function openForm(type) {
  seltool.hidden = true;
  const s = state.sel;
  rail.openForm(type, {
    label: s.quote ? '“' + s.quote + '”' : 'General note on the whole plan',
    editText: s.quote,
    rect: s.rect,
    extra: {quote: s.quote, section: s.section, prefix: s.prefix, suffix: s.suffix},
    onClose: () => { const sel = window.getSelection(); if (sel) sel.removeAllRanges(); },
  });
}

document.getElementById('act-comment').onclick = () => openForm('comment');
document.getElementById('act-edit').onclick = () => openForm('edit');
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') seltool.hidden = true;
});

/* ---------- boot ---------- */

mermaid.initialize({
  startOnLoad: false,
  securityLevel: 'loose',
  theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'neutral'
});
refresh().then(loadHistory);
setInterval(refresh, 2500);
</script>
</body>
</html>
