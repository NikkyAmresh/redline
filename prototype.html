<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redline</title>
<script src="/static/studio.js"></script>
<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/studio.css">
<script src="/static/rail.js"></script>
</head>
<body class="proto-page">

<header class="top">
  <a class="brand" href="/" aria-label="Redline home"><svg><use href="#mark"/></svg><span>Redline</span></a>
  <div class="ctx">
    <span class="vsep"></span>
    <nav class="crumbs" aria-label="Breadcrumb"><a href="/" id="ws"></a><span class="slash" id="wsSlash">/</span><span class="cur" id="title">&hellip;</span></nav>
    <button class="pill" id="verBtn" aria-haspopup="menu" aria-expanded="false" title="Versions"><span class="lv"></span><span class="vn" id="verN">v&hellip;</span><span id="verL">(live)</span><svg class="i s12"><use href="#i-chev"/></svg></button>
    <span class="pill" id="status"><svg class="i s12"><use href="#i-status"/></svg><span></span></span>
  </div>
  <button class="cmdk" id="cmdk" aria-label="Open command bar"><svg class="i s14"><use href="#i-search"/></svg><span class="lbl">Jump to a screen or run a command</span><span class="kbds"><kbd class="g mod"></kbd><kbd>K</kbd></span></button>
  <div class="tools">
    <button class="hbtn m-only" id="cmdkM" aria-label="Open command bar"><svg class="i"><use href="#i-search"/></svg></button>
    <a class="hbtn" id="planLink" hidden title="Open the plan behind this prototype"><svg class="i"><use href="#i-plan"/></svg><span class="lbl">Plan</span></a>
    <a class="hbtn" id="dl" title="Download this version"><svg class="i"><use href="#i-down"/></svg><span class="ext">.html</span></a>
    <button class="hbtn" data-theme-toggle></button>
    <span class="live" id="live"><i></i><span id="livetext">Connecting</span></span>
  </div>
</header>

<div class="app">
  <aside class="pane pane-left" id="pane-screens" aria-label="Screens and versions">
    <div class="pl-h"><span>Screens</span><span class="n" id="scount"></span></div>
    <ul class="outline screens" id="screens"></ul>
    <div class="pl-gap"></div>
    <div class="pl-h"><span>Versions</span><span class="n" id="vcount"></span></div>
    <ul class="versions" id="versions"></ul>
    <div class="pl-foot">
      <div class="r"><span>Commands</span><span class="kbds"><kbd class="g mod"></kbd><kbd>K</kbd></span></div>
      <div class="r"><span>Comment mode</span><span class="kbds"><kbd>C</kbd></span></div>
      <div class="r"><span>Note on this screen</span><span class="kbds"><kbd>N</kbd></span></div>
    </div>
  </aside>

  <main class="pane pane-stage m-active" id="pane-proto" aria-label="Prototype">
    <div class="stagebar">
      <span class="seg" id="modes">
        <button data-mode="interact" aria-pressed="true" title="Use the prototype"><svg class="i"><use href="#i-pointer"/></svg>Interact</button>
        <button data-mode="comment" aria-pressed="false" title="Click any component to comment on it (C)"><svg class="i"><use href="#i-comment"/></svg>Comment<kbd>C</kbd></button>
      </span>
      <span class="seg" id="devices">
        <button data-device="mobile" title="Phone, 390 wide" aria-label="Phone"><svg class="i"><use href="#i-phone"/></svg><span class="wide">Phone</span></button>
        <button data-device="tablet" title="Tablet, 820 wide" aria-label="Tablet"><svg class="i"><use href="#i-tablet"/></svg><span class="wide">Tablet</span></button>
        <button data-device="desktop" title="Desktop, fills the stage" aria-label="Desktop"><svg class="i"><use href="#i-desktop"/></svg><span class="wide">Desktop</span></button>
      </span>
      <select class="tsel" id="screen" title="Jump to a screen" aria-label="Screen"><option>Screens</option></select>
      <span class="sp"></span>
      <label class="mini-switch wide" title="Show pins that are already resolved"><button class="switch" role="switch" aria-checked="false" id="showres"></button>Resolved</label>
      <label class="mini-switch wide" title="Draw device chrome around the prototype"><button class="switch" role="switch" aria-checked="true" id="chrome"></button>Chrome</label>
      <span class="vsep wide"></span>
      <button class="icon-btn" id="reset" title="Reload the prototype and reset its state" aria-label="Reset"><svg class="i"><use href="#i-reset"/></svg></button>
      <a class="icon-btn" id="newtab" target="_blank" rel="noopener" title="Open the prototype alone in a new tab" aria-label="Open in a new tab"><svg class="i"><use href="#i-ext"/></svg></a>
    </div>
    <div class="histbar" id="histbar" hidden>
      <span class="t" id="histtext"></span>
      <button class="btn-sm solo" id="histrestore">Restore this version</button>
      <button class="btn-ghost" id="histback">Back to live</button>
    </div>
    <section id="stage">
      <div id="fit">
        <div id="device">
          <div class="statusbar"><span>9:41</span><span class="icons">
            <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
            <svg viewBox="0 0 16 12"><path d="M8 11.5l2.4-2.9a3.6 3.6 0 0 0-4.8 0z" fill="currentColor"/><path d="M3.6 6.3a6.6 6.6 0 0 1 8.8 0M1.2 3.6a10 10 0 0 1 13.6 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="23" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="20" height="8" rx="2" fill="currentColor"/><path d="M25 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".45"/></svg>
          </span></div>
          <div class="browserbar"><i></i><i></i><i></i><span class="url" id="url"></span></div>
          <iframe id="frame" title="Prototype" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
          <div class="homebar"><span></span></div>
        </div>
      </div>
      <div id="modehint"><svg class="i s14"><use href="#i-comment"/></svg>Click a component, drag a box for an area, hold <kbd>Alt</kbd> for the exact element, <kbd>Esc</kbd> to stop</div>
    </section>
  </main>

  <aside class="pane pane-right" id="pane-comments" aria-label="Review">
    <div class="itabs" role="tablist">
      <button class="itab" role="tab" aria-selected="true" data-tab="comments">Comments <span class="rdot" id="rdot" hidden></span><span class="ct" id="ccount">0</span></button>
      <button class="itab" role="tab" aria-selected="false" data-tab="history">History</button>
    </div>
    <div class="ipanel" id="tab-comments" role="tabpanel"></div>
    <div class="ipanel" id="tab-history" role="tabpanel" hidden></div>
    <div class="ifoot" id="ifoot"></div>
  </aside>
</div>

<nav class="tabbar" id="tabbar" role="tablist">
  <button data-pane="pane-screens" aria-selected="false"><svg class="i"><use href="#i-list"/></svg>Screens</button>
  <button data-pane="pane-proto" aria-selected="true"><svg class="i"><use href="#i-phone"/></svg>Prototype</button>
  <button data-pane="pane-comments" aria-selected="false"><svg class="i"><use href="#i-comment"/></svg>Comments<span class="tb-badge" id="tbBadge" hidden></span></button>
</nav>
<div class="pop" id="verPop" role="menu" hidden></div>

<script>
const slug = location.pathname.split('/').filter(Boolean).slice(1).map(decodeURIComponent).join('/');
const ws = slug.includes('/') ? slug.split('/')[0] : '';
const {api, toast, esc} = Redline;
const {MAC, theme, vLabel, niceDate, subjectTitle, showPane, setLive} = Studio;
const $ = id => document.getElementById(id);
const frame = $('frame'), stage = $('stage'), fit = $('fit'), device = $('device');

const DEVICES = {
  mobile: {w: 390, h: 844, border: 12},
  tablet: {w: 820, h: 1180, border: 16},
  desktop: null,
};
const DEVICE_NAMES = {mobile: 'Phone', tablet: 'Tablet', desktop: 'Desktop'};

const state = {
  proto: null, mode: 'interact', device: null, chrome: true, showResolved: false,
  screens: [], screen: '', title: '', route: '', detached: new Set(),
  history: [], historySha: null, shots: new Map(), focusAfterLoad: null, loads: 0,
};

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

function post(msg) {
  if (frame.contentWindow) frame.contentWindow.postMessage(Object.assign({__redline: 1}, msg), '*');
}

function base() {
  return state.historySha ? '/p-at/' + state.historySha + '/' + slug + '/' : '/p/' + slug + '/';
}

/* ---------- review panel ---------- */

const RANK = {answered: 4, draft: 3, submitted: 2, resolved: 1};
const BADGE = {answered: 'b-reply', draft: 'b-draft', submitted: 'b-waiting', resolved: 'b-resolved'};

const rail = Redline.mount({
  slug,
  list: $('tab-comments'),
  footer: $('ifoot'),
  hint: 'Press <kbd>C</kbd> or pick Comment, then click any component in the prototype to pin a ' +
        'comment or a copy change to it. Drag a box to comment on an area. ' +
        'Drafts collect here; send them to Claude in one batch.',
  actions: [
    {label: 'Note on this screen', key: 'N', title: 'A note about the screen on show, not one component',
     onClick: () => openScreenNote()},
    {label: 'General note', title: 'A note about the whole prototype', onClick: () => generalNote()},
  ],
  decorate: item => {
    const a = item.anchor;
    if (!a) return {};
    if (item.kind === 'screen') return {where: 'note on this screen'};
    const detached = state.detached.has(item.id) && item.status !== 'resolved';
    return {
      num: pinNumber(item.id),
      where: a.component || (a.tag ? a.tag + (a.box ? ' area' : '') : ''),
      chip: detached ? '<span class="chip" title="This component is no longer found on its screen">detached</span>' : '',
    };
  },
  onCardClick: item => {
    const a = item.anchor;
    if (!a || state.historySha) return;
    showPane('pane-proto');
    if (state.detached.has(item.id)) toast('This component is no longer on its screen; Claude still has the details');
    post({type: 'goto', route: a.route, screen: a.screen, focus: item.kind === 'pin' ? item.id : null});
  },
  onRender: () => {
    const c = rail.counts();
    $('ccount').textContent = c.total;
    $('rdot').hidden = !c.answered;
    $('tbBadge').hidden = !c.answered;
    $('tbBadge').textContent = c.answered;
    renderScreens();
  },
  refresh: () => refresh(),
});

function openScreenNote() {
  if (state.historySha) { toast('Go back to the live version to comment'); return; }
  const title = state.title || state.screen || 'this screen';
  rail.openForm('comment', {
    label: 'Note on the ' + title + ' screen', rect: null,
    extra: {kind: 'screen', section: title, quote: '',
            anchor: {screen: state.screen, title, route: state.route,
                     viewport: {name: state.device, w: frame.clientWidth, h: frame.clientHeight}}},
  });
}

function generalNote() {
  if (state.historySha) { toast('Go back to the live version to comment'); return; }
  rail.openForm('comment', {label: 'General note on the whole prototype', rect: null});
}

// pins are numbered in the order they were made, the same on cards and markers
function pinList() {
  let n = 0;
  return rail.items().filter(i => i.kind === 'pin' && i.anchor)
    .map(i => ({id: i.id, n: ++n, status: i.status, anchor: i.anchor}));
}

function pinNumber(id) {
  const p = pinList().find(x => x.id === id);
  return p ? p.n : null;
}

function sendPins() {
  const pins = state.historySha ? [] : pinList();
  post({type: 'pins', pins, showResolved: state.showResolved});
}

/* ---------- screens ---------- */

function renderScreens() {
  // the left list, with a badge of the comments on each screen
  const per = new Map();
  if (!state.historySha) for (const i of rail.items()) {
    const s = i.anchor && i.anchor.screen;
    if (s) { if (!per.has(s)) per.set(s, []); per.get(s).push(i.status); }
  }
  $('scount').textContent = state.screens.length || '';
  $('screens').innerHTML = state.screens.length ? state.screens.map(s => {
    const st = per.get(s.id) || [];
    const top = st.slice().sort((a, b) => RANK[b] - RANK[a])[0];
    return '<li><a data-screen="' + esc(s.id) + '"' + (s.id === state.screen ? ' class="on"' : '') + '>'
      + '<svg class="i s14"><use href="#i-screen"/></svg><span class="t">' + esc(s.title) + '</span>'
      + (st.length ? '<span class="badge ' + BADGE[top] + '">' + st.length + '</span>' : '') + '</a></li>';
  }).join('') : '<li class="pl-empty">' + (state.route ? esc(state.route) + '<br>' : '') + 'No screens tagged</li>';
  // and the picker in the stage bar
  const sel = $('screen');
  if (!state.screens.length) {
    sel.innerHTML = '<option>' + esc(state.route || 'No screens tagged') + '</option>';
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  sel.innerHTML = state.screens.map(s =>
    '<option value="' + esc(s.id) + '"' + (s.id === state.screen ? ' selected' : '') + '>' + esc(s.title) + '</option>').join('');
}

function gotoScreen(id) {
  showPane('pane-proto');
  post({type: 'goto', screen: id});
}
$('screens').addEventListener('click', e => { const a = e.target.closest('a[data-screen]'); if (a) gotoScreen(a.dataset.screen); });
$('screen').onchange = e => gotoScreen(e.target.value);

/* ---------- device stage ---------- */

function setDevice(name, remember) {
  if (!(name in DEVICES)) name = 'mobile';
  state.device = name;
  if (remember) store.set('rl-device:' + slug, name);
  document.querySelectorAll('#devices button').forEach(b => b.setAttribute('aria-pressed', b.dataset.device === name));
  device.className = name + (state.chrome ? ' chrome' : '');
  stage.classList.toggle('desktop', name === 'desktop');
  layoutStage();
}

function layoutStage() {
  const d = DEVICES[state.device];
  if (!d) {
    device.style.width = device.style.height = device.style.transform = '';
    fit.style.width = fit.style.height = '';
    return;
  }
  const border = state.chrome ? d.border : 0;
  const W = d.w + border * 2, H = d.h + border * 2;
  // the iframe keeps the true device width; chrome bars come out of the height
  device.style.width = W + 'px';
  device.style.height = H + 'px';
  const pad = Studio.isPhone() ? 14 : 32;
  const s = Math.min(1, (stage.clientWidth - pad * 2) / W, (stage.clientHeight - pad * 2) / H);
  device.style.transform = 'scale(' + s + ')';
  fit.style.width = W * s + 'px';
  fit.style.height = H * s + 'px';
}

new ResizeObserver(layoutStage).observe(stage);

$('devices').onclick = e => {
  const b = e.target.closest('[data-device]');
  if (b) setDevice(b.dataset.device, true);
};

function setChrome(on) {
  state.chrome = on;
  $('chrome').setAttribute('aria-checked', on);
  store.set('rl-chrome', on ? '1' : '0');
  setDevice(state.device);
}
function setShowResolved(on) {
  state.showResolved = on;
  $('showres').setAttribute('aria-checked', on);
  sendPins();
}
state.chrome = store.get('rl-chrome') !== '0';
$('chrome').setAttribute('aria-checked', state.chrome);
$('chrome').onclick = e => { e.preventDefault(); setChrome(!state.chrome); };
$('showres').onclick = e => { e.preventDefault(); setShowResolved(!state.showResolved); };

/* ---------- modes ---------- */

function setMode(m) {
  if (state.historySha) m = 'interact';
  state.mode = m;
  document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
  $('modehint').classList.toggle('on', m === 'comment');
  stage.classList.toggle('commenting', m === 'comment');
  post({type: 'mode', mode: m});
}

$('modes').onclick = e => {
  const b = e.target.closest('[data-mode]');
  if (b && !b.disabled) setMode(b.dataset.mode);
};

function onKey(key) {
  if (key === 'palette') { pal.isOpen() ? pal.close() : pal.open(); return; }
  if (key === 'Escape') {
    if (rail.isFormOpen()) rail.closeForm();
    else if (state.mode === 'comment') setMode('interact');
  } else if (key === 'c' && !rail.isFormOpen() && !state.historySha) {
    setMode(state.mode === 'comment' ? 'interact' : 'comment');
  } else if (key === 'n' && !rail.isFormOpen()) {
    openScreenNote();
  }
}

document.addEventListener('keydown', e => {
  const t = e.target;
  const typing = t && t.closest && t.closest('input, textarea, select, [contenteditable="true"]');
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key === 'Enter' && !typing && !rail.isFormOpen()) { e.preventDefault(); if (!state.historySha) rail.send(); return; }
  if (typing || mod || e.altKey || pal.isOpen()) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'c' || k === 'n' || k === 'Escape') { if (k !== 'Escape') e.preventDefault(); onKey(k); }
});

/* ---------- frame ---------- */

function frameUrl(route, at) {
  route = route || '';
  const h = route.indexOf('#');
  const pg = h >= 0 ? route.slice(0, h) : route;
  const hash = h >= 0 ? route.slice(h) : '';
  return (at || base()) + pg + '?rl=' + (++state.loads) + hash;
}

function loadFrame(keepRoute) {
  frame.src = frameUrl(keepRoute ? state.route : '');
}

$('reset').onclick = () => loadFrame(false);

window.addEventListener('message', e => {
  if (e.source !== frame.contentWindow || !e.data || !e.data.__redline) return;
  const m = e.data;
  if (m.type === 'hello') {
    post({type: 'init', base: base(), mode: state.mode, showResolved: state.showResolved,
          pins: state.historySha ? [] : pinList()});
    if (state.focusAfterLoad) {
      const f = state.focusAfterLoad;
      state.focusAfterLoad = null;
      setTimeout(() => post({type: 'flash', id: f}), 250);
    }
  } else if (m.type === 'state') {
    state.screens = m.screens || [];
    state.screen = m.screen || '';
    state.title = m.title || '';
    state.route = m.route || '';
    renderScreens();
    $('url').textContent = base() + state.route;
    $('newtab').href = base() + state.route;
  } else if (m.type === 'pick') {
    onPick(m);
  } else if (m.type === 'shot') {
    const done = state.shots.get(m.pid);
    if (done) { state.shots.delete(m.pid); done(m.data); }
  } else if (m.type === 'pinclick') {
    showPane('pane-comments');
    showTab('comments');
    rail.focusCard(m.id);
  } else if (m.type === 'detached') {
    state.detached = new Set(m.ids || []);
    rail.render();
  } else if (m.type === 'key') {
    onKey(m.key);
  } else if (m.type === 'dragging') {
    state.dragging = !!m.on;
  }
});

/* A drag that started in the prototype can leave the iframe; the shell then
   sees the pointer, so it hands the position back in iframe coordinates. */
function frameXY(e) {
  const fr = frame.getBoundingClientRect();
  const s = fr.width / (frame.offsetWidth || fr.width || 1);
  return {x: (e.clientX - fr.left) / s, y: (e.clientY - fr.top) / s};
}
window.addEventListener('pointermove', e => {
  if (state.dragging) post(Object.assign({type: 'dragmove'}, frameXY(e)));
});
window.addEventListener('pointerup', e => {
  if (!state.dragging) return;
  state.dragging = false;
  post(Object.assign({type: 'dragend'}, frameXY(e)));
});

function toPage(r) {
  const fr = frame.getBoundingClientRect();
  const s = fr.width / (frame.offsetWidth || fr.width || 1);
  return {left: fr.left + r.left * s + scrollX, right: fr.left + r.right * s + scrollX,
          top: fr.top + r.top * s + scrollY, bottom: fr.top + r.bottom * s + scrollY};
}

function onPick(m) {
  if (state.historySha || state.mode !== 'comment') { post({type: 'hold', on: false}); return; }
  const a = m.anchor;
  a.viewport = Object.assign({name: state.device}, a.viewport || {});
  const title = a.title || a.screen || '';
  const shot = new Promise(res => {
    state.shots.set(m.pid, res);
    setTimeout(() => { if (state.shots.delete(m.pid)) res(null); }, 6000);
  });
  rail.openForm('comment', {
    label: m.text ? '“' + (m.text.length > 140 ? m.text.slice(0, 140) + '...' : m.text) + '”' : m.label,
    where: (title ? title + ' · ' : '') + m.label,
    editText: m.text,
    allowEdit: m.editable,
    rect: toPage(m.rect),
    place: Studio.isPhone() ? 'below' : 'side',
    extra: {kind: 'pin', anchor: a, section: title, quote: (m.text || m.label).slice(0, 300)},
    onClose: () => post({type: 'hold', on: false}),
  });
  rail.attachImage(shot.then(data => data ? rail.uploadDataUrl(data) : null), true);
}

/* ---------- inspector tabs ---------- */

document.querySelector('.itabs').addEventListener('click', e => {
  const t = e.target.closest('.itab');
  if (t) showTab(t.dataset.tab);
});
function showTab(name) {
  document.querySelectorAll('.itab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === name));
  ['comments', 'history'].forEach(n => { $('tab-' + n).hidden = n !== name; });
}

/* ---------- live data ---------- */

function header(meta, live) {
  const title = meta.title || slug;
  $('title').textContent = title;
  document.title = title + ' · Redline';
  $('ws').textContent = ws;
  $('ws').hidden = $('wsSlash').hidden = !ws;
  $('verN').textContent = 'v' + (meta.version || '1');
  $('verL').textContent = live ? '(live)' : '(read only)';
  $('verBtn').classList.toggle('old', !live);
  $('status').querySelector('span').textContent = meta.status || 'draft';
  const pl = $('planLink');
  pl.hidden = !meta.plan;
  if (meta.plan) pl.href = '/plan/' + meta.plan;
  $('dl').href = state.historySha ? '/raw-at/' + state.historySha + '/' + slug : '/raw/' + slug;
}

async function refresh() {
  if (state.historySha) return;
  let p, fb;
  try {
    [p, fb] = await Promise.all([api('/api/proto/' + slug), api('/api/feedback/' + slug)]);
  } catch (e) { setLive(false); return; }
  setLive(true);
  if (rail.busy()) return;
  if (!state.proto) {
    state.proto = p;
    header(p.meta, true);
    setDevice(store.get('rl-device:' + slug) || p.meta.device || 'mobile');
    rail.setFeedback(fb);
    loadFrame(false);
    return;
  }
  if (p.mtime !== state.proto.mtime) {
    const oldV = state.proto.meta.version;
    state.proto = p;
    header(p.meta, true);
    loadFrame(true);
    if (oldV !== p.meta.version) {
      toast('Claude updated the prototype to v' + p.meta.version);
      loadHistory();
    }
  }
  if (rail.setFeedback(fb)) sendPins();
}

/* ---------- versions ---------- */

const liveVersion = () => String(state.proto && state.proto.meta.version || '');

async function loadHistory() {
  let data;
  try { data = await api('/api/history/' + slug); } catch (e) { return; }
  state.history = data.commits || [];
  renderVersions();
}

function renderVersions() {
  $('vcount').textContent = state.history.length || '';
  $('versions').innerHTML = Studio.versionList(state.history, liveVersion(), state.historySha);
  $('tab-history').innerHTML = Studio.historyTimeline(state.history, liveVersion(), state.historySha, slug);
}

function pickVersion(b) {
  showPane('pane-proto');
  if (b.dataset.live === 'true') exitHistory(); else if (b.dataset.sha) enterHistory(b.dataset.sha);
}
$('versions').addEventListener('click', e => { const b = e.target.closest('.vrow'); if (b) pickVersion(b); });
$('tab-history').addEventListener('click', e => { const b = e.target.closest('button[data-sha]'); if (b) pickVersion(b); });

Studio.menu($('verBtn'), $('verPop'), () => Studio.versionMenuItems(state.history, liveVersion(), state.historySha)
  + '<div class="pop-f"><button data-act="download">Download this version</button></div>', b => {
  if (b.dataset.act === 'download') location.href = $('dl').href;
  else pickVersion(b);
});

async function enterHistory(sha) {
  let data;
  try { data = await api('/api/history-at/' + sha + '/' + slug); }
  catch (e) { toast('Could not load that version'); return; }
  if (rail.isFormOpen()) rail.closeForm();
  setMode('interact');
  state.historySha = sha;
  rail.setDisabled(true);
  document.querySelector('#modes [data-mode="comment"]').disabled = true;
  const c = state.history.find(h => h.sha === sha);
  $('histbar').hidden = false;
  $('histtext').textContent = 'Read only: ' + (c ? vLabel(c) + ', ' + niceDate(c.date) + ', ' + subjectTitle(c) : sha.slice(0, 7));
  header(Object.assign({}, state.proto ? state.proto.meta : {}, data.meta || {}), false);
  layoutStage();
  frame.src = frameUrl(state.route, base());
  renderVersions();
  renderScreens();
}

function exitHistory() {
  if (!state.historySha) return;
  state.historySha = null;
  $('histbar').hidden = true;
  rail.setDisabled(false);
  document.querySelector('#modes [data-mode="comment"]').disabled = false;
  if (state.proto) header(state.proto.meta, true);
  layoutStage();
  loadFrame(true);
  renderVersions();
  renderScreens();
}

$('histback').onclick = exitHistory;
$('histrestore').onclick = async () => {
  if (!state.historySha) return;
  if (!confirm('Restore this version as the new latest? It is added as a new version; nothing is lost.')) return;
  try {
    const r = await api('/api/restore/' + state.historySha + '/' + slug, {});
    toast('Restored as v' + r.version);
    exitHistory();
    loadHistory();
  } catch (e) { toast('Restore failed'); }
};

/* ---------- command bar ---------- */

function commands() {
  const out = [];
  const add = (group, title, run, extra) => out.push(Object.assign({group, title, run}, extra || {}));
  if (!state.historySha) {
    add('Actions', state.mode === 'comment' ? 'Stop commenting' : 'Comment on a component', () => setMode(state.mode === 'comment' ? 'interact' : 'comment'), {key: 'C', icon: 'comment'});
    add('Actions', 'Note on this screen', openScreenNote, {key: 'N', icon: 'screen'});
    add('Actions', 'General note', generalNote, {icon: 'edit'});
    const c = rail.counts();
    if (c.draft) add('Actions', 'Send ' + c.draft + ' to Claude', () => rail.send(), {key: MAC ? '⌘ ↵' : 'Ctrl ↵'});
  } else {
    add('Actions', 'Back to the live version', exitHistory, {icon: 'history'});
  }
  for (const d of Object.keys(DEVICES)) if (d !== state.device)
    add('Actions', 'Show on ' + DEVICE_NAMES[d].toLowerCase(), () => setDevice(d, true), {icon: d === 'mobile' ? 'phone' : d});
  add('Actions', (state.chrome ? 'Hide' : 'Show') + ' device chrome', () => setChrome(!state.chrome), {icon: 'phone'});
  add('Actions', (state.showResolved ? 'Hide' : 'Show') + ' resolved pins', () => setShowResolved(!state.showResolved), {icon: 'comment'});
  add('Actions', 'Reset the prototype', () => loadFrame(false), {icon: 'reset'});
  add('Actions', 'Open in a new tab', () => window.open($('newtab').href, '_blank', 'noopener'), {icon: 'ext'});
  if (state.proto && state.proto.meta.plan) add('Actions', 'Open the plan', () => { location.href = $('planLink').href; }, {icon: 'plan'});
  add('Actions', 'Download this version', () => { location.href = $('dl').href; }, {icon: 'down'});
  add('Actions', 'Switch to the ' + (theme() === 'dark' ? 'light' : 'dark') + ' theme', Studio.toggleTheme, {icon: theme() === 'dark' ? 'sun' : 'moon'});
  state.screens.forEach(s => add('Screens', s.title, () => gotoScreen(s.id), {icon: 'screen'}));
  if (!state.historySha) rail.items().forEach(i => add('Comments',
    (i.kind === 'pin' ? '#' + pinNumber(i.id) + ' ' : '') + (i.quote || (i.kind === 'screen' ? 'Note on ' + (i.section || 'a screen') : 'General note')) + (i.comment ? ': ' + i.comment : ''),
    () => { showPane('pane-comments'); showTab('comments'); rail.focusCard(i.id); if (i.anchor && i.anchor.screen) post({type: 'goto', route: i.anchor.route, screen: i.anchor.screen, focus: i.kind === 'pin' ? i.id : null}); },
    {dot: i.status === 'answered' ? 'var(--red)' : i.status === 'resolved' ? 'var(--green)' : i.status === 'submitted' ? 'var(--blue)' : 'var(--amber)'}));
  state.history.forEach((v, i) => add('Versions', vLabel(v) + ', ' + subjectTitle(v),
    () => Studio.isLive(v, i, liveVersion()) ? exitHistory() : enterHistory(v.sha), {icon: 'history'}));
  return out;
}

const pal = Studio.palette(commands);
$('cmdk').onclick = pal.open;
$('cmdkM').onclick = pal.open;

/* ---------- boot ---------- */

refresh().then(loadHistory);
setInterval(refresh, 2500);
</script>
</body>
</html>
