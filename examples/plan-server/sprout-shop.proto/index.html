<!doctype html>
<html lang="en">

<style>
:root {
  --bg:#f6f3ec; --card:#ffffff; --ink:#1c2a21; --muted:#6c776f; --line:#e8e2d5;
  --green:#2f6f4a; --green-2:#3f8a5d; --green-soft:#e3eee6; --clay:#c9714a; --red:#c2412d;
  --kit-accent:#2f6f4a; --kit-ink:#1c2a21;
  --font:-apple-system, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { background:#e9e4d8; color:var(--ink); font:15px/1.45 var(--font); -webkit-font-smoothing:antialiased; }
button, input { font:inherit; color:inherit; }
button { cursor:pointer; border:0; background:none; }
svg { display:block; }

.app { position:relative; height:100%; max-width:520px; margin:0 auto; background:var(--bg);
       display:flex; flex-direction:column; overflow:hidden; }
.screen { flex:1; min-height:0; overflow-y:auto; padding:14px 18px 24px; }
.screen::-webkit-scrollbar { display:none; }

/* ---------- shared ---------- */
.row { display:flex; align-items:center; gap:10px; }
.between { justify-content:space-between; }
.icon-btn { width:42px; height:42px; border-radius:14px; display:grid; place-items:center;
            background:var(--card); border:1px solid var(--line); position:relative; }
.icon-btn svg { width:20px; height:20px; }
.badge { position:absolute; top:-5px; right:-5px; min-width:19px; height:19px; padding:0 5px;
         border-radius:10px; background:var(--clay); color:#fff; font-size:11px; font-weight:700;
         display:grid; place-items:center; border:2px solid var(--bg); }
.badge[hidden] { display:none; }
.h1 { font-size:26px; line-height:1.15; font-weight:750; letter-spacing:-.02em; }
.muted { color:var(--muted); }
.btn { display:flex; align-items:center; justify-content:center; gap:8px; height:52px; border-radius:16px;
       background:var(--green); color:#fff; font-weight:650; font-size:16px; width:100%; }
.btn:active { transform:scale(.99); }
.btn.ghost { background:var(--card); color:var(--ink); border:1px solid var(--line); }
.btn[disabled] { opacity:.7; }
.spin { width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.4);
        border-top-color:#fff; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.price { font-weight:750; letter-spacing:-.01em; }
.heart.on svg path { fill:var(--red); stroke:var(--red); }

/* ---------- home ---------- */
.brand { display:flex; align-items:center; gap:9px; font-weight:800; font-size:20px; letter-spacing:-.02em; }
.brand svg { width:34px; height:34px; }
.hello { margin:18px 0 14px; }
.search { display:flex; align-items:center; gap:10px; height:48px; padding:0 14px; border-radius:16px;
          background:var(--card); border:1px solid var(--line); }
.search svg { width:18px; height:18px; color:var(--muted); flex:none; }
.search input { flex:1; border:0; outline:0; background:none; font-size:15px; }
.chips { display:flex; gap:8px; overflow-x:auto; margin:14px -18px 0; padding:0 18px; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:none; height:36px; padding:0 14px; border-radius:18px; background:var(--card);
        border:1px solid var(--line); font-size:14px; font-weight:550; color:var(--muted); }
.chip.on { background:var(--ink); border-color:var(--ink); color:#fff; }
.featured { margin-top:16px; border-radius:22px; padding:18px; color:#fff; overflow:hidden; position:relative;
            background:linear-gradient(135deg, #2f6f4a, #1f4d33); min-height:132px; }
.featured .tag { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.8; }
.featured h3 { font-size:21px; line-height:1.2; margin:6px 0 12px; max-width:62%; letter-spacing:-.01em; }
.featured button { height:36px; padding:0 14px; border-radius:12px; background:#fff; color:var(--green);
                   font-weight:700; font-size:14px; }
.featured svg.art { position:absolute; right:-6px; bottom:-10px; width:150px; height:150px; }
.section-h { display:flex; justify-content:space-between; align-items:baseline; margin:22px 0 12px; }
.section-h h2 { font-size:18px; letter-spacing:-.01em; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.card { background:var(--card); border-radius:20px; padding:10px; border:1px solid var(--line);
        display:flex; flex-direction:column; text-align:left; }
.card .art { border-radius:14px; height:132px; display:grid; place-items:center; position:relative; }
.card .art svg.plant { width:116px; height:116px; }
.card .heart { position:absolute; top:7px; right:7px; width:32px; height:32px; border-radius:11px;
               background:rgba(255,255,255,.85); display:grid; place-items:center; }
.card .heart svg { width:17px; height:17px; }
.card .name { font-weight:650; margin:9px 2px 0; font-size:14.5px; }
.card .sub { font-size:12.5px; margin:0 2px; }
.card .foot { display:flex; justify-content:space-between; align-items:center; margin:8px 2px 2px; }
.add { width:34px; height:34px; border-radius:12px; background:var(--green); color:#fff; display:grid; place-items:center; }
.add svg { width:18px; height:18px; }
.empty { text-align:center; padding:40px 20px; }
.empty svg { width:120px; height:120px; margin:0 auto 10px; }
.empty h3 { font-size:18px; margin-bottom:6px; }
.empty .btn { margin-top:18px; }

/* ---------- product ---------- */
.p-top { display:flex; justify-content:space-between; }
.p-hero { margin:12px 0 0; height:300px; border-radius:26px; display:grid; place-items:center; }
.p-hero svg.plant { width:250px; height:250px; }
.p-name { margin-top:18px; }
.latin { font-style:italic; margin-top:2px; }
.stars { display:flex; align-items:center; gap:6px; margin-top:8px; font-size:13.5px; }
.stars svg { width:15px; height:15px; color:#e0a526; }
.care { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin:18px 0; }
.care div { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 6px; text-align:center; }
.care svg { width:20px; height:20px; margin:0 auto 5px; color:var(--green); }
.care b { display:block; font-size:12.5px; }
.care span { font-size:11px; color:var(--muted); }
.desc { color:#46524a; }
.buybar { display:flex; gap:12px; align-items:center; padding:12px 18px 16px; background:var(--card);
          border-top:1px solid var(--line); }
.stepper { display:flex; align-items:center; border:1px solid var(--line); border-radius:14px; height:52px; }
.stepper button { width:42px; height:100%; display:grid; place-items:center; }
.stepper button svg { width:16px; height:16px; }
.stepper span { min-width:24px; text-align:center; font-weight:700; }
.stepper.small { height:36px; border-radius:11px; }
.stepper.small button { width:32px; }

/* ---------- saved and bag ---------- */
.list { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
.line { display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line);
        border-radius:18px; padding:10px; }
.line .thumb { width:72px; height:72px; border-radius:13px; display:grid; place-items:center; flex:none; }
.line .thumb svg { width:66px; height:66px; }
.line .info { flex:1; min-width:0; }
.line .info b { display:block; font-size:14.5px; }
.line .rm { width:34px; height:34px; display:grid; place-items:center; color:var(--muted); }
.line .rm svg { width:18px; height:18px; }
.box { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; margin-top:12px; }
.box h4 { font-size:14px; margin-bottom:10px; }
.slots { display:flex; gap:8px; }
.slot { flex:1; border:1px solid var(--line); border-radius:12px; padding:8px; text-align:left; font-size:12.5px; }
.slot b { display:block; font-size:13px; }
.slot.on { border-color:var(--green); background:var(--green-soft); }
.promo { display:flex; gap:8px; }
.promo input { flex:1; height:44px; border:1px solid var(--line); border-radius:12px; padding:0 12px; outline:0;
               text-transform:uppercase; background:var(--bg); }
.promo button { height:44px; padding:0 16px; border-radius:12px; background:var(--ink); color:#fff; font-weight:650; }
.promo-msg { font-size:12.5px; margin-top:7px; }
.promo-msg.ok { color:var(--green); }
.promo-msg.err { color:var(--red); }
.sum div { display:flex; justify-content:space-between; padding:4px 0; }
.sum .total { border-top:1px dashed var(--line); margin-top:6px; padding-top:10px; font-weight:750; font-size:17px; }
.sum .gst { padding-top:0; font-size:12.5px; color:var(--muted); }
.checkout { padding:12px 18px 16px; background:var(--card); border-top:1px solid var(--line); }

/* ---------- done ---------- */
.done { text-align:center; padding-top:60px; }
.tick { width:96px; height:96px; border-radius:50%; background:var(--green-soft); display:grid; place-items:center;
        margin:0 auto 18px; animation:pop .5s cubic-bezier(.2,1.4,.4,1); }
.tick svg { width:46px; height:46px; color:var(--green); }
@keyframes pop { from { transform:scale(.4); opacity:0; } to { transform:none; opacity:1; } }
.receipt { text-align:left; margin:26px 0 18px; }
.receipt div { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); }
.receipt div:last-child { border:0; }

/* ---------- tab bar ---------- */
.tabbar { display:flex; justify-content:space-around; padding:8px 10px 12px; background:var(--card);
          border-top:1px solid var(--line); }
.tabbar[hidden] { display:none; }
.tab { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11.5px; font-weight:600;
       color:var(--muted); width:84px; position:relative; }
.tab svg { width:23px; height:23px; }
.tab.on { color:var(--green); }
.tab .badge { top:-4px; right:20px; }
</style>
</head>
<body>
<div class="app">

  <section class="screen" data-rl-screen="home" data-rl-title="Shop">
    <div class="row between" data-rl="home.header">
      <div class="brand" data-rl="home.logo">
        <svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="#2f6f4a"/><path d="M17 26c0-7 1.5-11.5 7.5-15-1 6.5-3 10.5-7.5 15z" fill="#bfe3c9"/><path d="M17 26c0-6-2-10-8-12.5 0 6 3 10 8 12.5z" fill="#fff"/><path d="M17 26v-9" stroke="#1f4d33" stroke-width="1.6" stroke-linecap="round"/></svg>
        Sprout
      </div>
      <button class="icon-btn" data-rl="home.bag-button" data-go="cart" aria-label="Bag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>

      <input id="q" placeholder="Search plants" autocomplete="off">

    <div class="chips" data-rl="home.categories" id="chips"></div>
    <div class="featured" data-rl="home.featured">

  <section class="screen" data-rl-screen="product" data-rl-title="Plant detail" hidden></section>

  <section class="screen" data-rl-screen="saved" data-rl-title="Saved" hidden></section>

  <section class="screen" data-rl-screen="cart" data-rl-title="Bag" hidden></section>

  <section class="screen" data-rl-screen="done" data-rl-title="Order placed" hidden></section>

  <div id="bottom"></div>

  <nav class="tabbar" data-rl="nav.tabbar" id="tabbar">
    <button class="tab" data-go="home" data-tab="home" data-rl="nav.tab-shop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c0-8 2-12.5 8-16-1 7.5-3.5 12-8 16z"/><path d="M12 21c0-6.5-2.5-10.5-8-13 0 6.5 3 10.5 8 13z"/></svg>Shop</button>
    <button class="tab" data-go="saved" data-tab="saved" data-rl="nav.tab-saved">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7.6 4.2 4.2 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg>Saved</button>
    <button class="tab" data-go="cart" data-tab="cart" data-rl="nav.tab-bag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>Bag<span class="badge" data-count hidden></span></button>
  </nav>
</div>

<script>
const {fake, esc, money} = Kit;

/* ---------- icons ---------- */
const I = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',

/* ---------- plants ---------- */
const PLANTS = [
  {id: 'monstera', name: 'Monstera Deliciosa', latin: 'Monstera deliciosa', price: 1299, kind: 'split',
   tags: ['Indoor'], light: 'Bright, indirect', water: 'Weekly', size: '60 cm', pet: false,

   tags: ['Indoor', 'Low light'], light: 'Low to medium', water: 'Every 10 days', size: '30 cm trail', pet: false,
   leaf: '#5a9a3c', dark: '#d9cf6b', pot: '#9fb59a', rim: '#869c81', tint: '#eef3e3', rating: 4.8, reviews: 377},
  {id: 'echeveria', name: 'Echeveria Lola', latin: 'Echeveria lola', price: 299, kind: 'rosette',
   tags: ['Succulents', 'Pet friendly'], light: 'Full sun', water: 'Every 2 weeks', size: '12 cm', pet: true,
   leaf: '#9cc1b1', dark: '#c99fb4', pot: '#c9714a', rim: '#a95a38', tint: '#f1ece6', rating: 4.7, reviews: 156},
  {id: 'zz', name: 'ZZ Plant', latin: 'Zamioculcas zamiifolia', price: 899, kind: 'zz',
   tags: ['Indoor', 'Low light'], light: 'Low light', water: 'Every 3 weeks', size: '50 cm', pet: false,
   leaf: '#2e6a3c', dark: '#1d4a29', pot: '#e9dcc6', rim: '#d3c3a8', tint: '#e8eee3', rating: 4.9, reviews: 301},
  {id: 'calathea', name: 'Calathea Orbifolia', latin: 'Goeppertia orbifolia', price: 1099, kind: 'round',

  {id: 'haworthia', name: 'Zebra Haworthia', latin: 'Haworthiopsis attenuata', price: 349, kind: 'rosette',
   tags: ['Succulents', 'Pet friendly'], light: 'Bright light', water: 'Every 3 weeks', size: '10 cm', pet: true,
   leaf: '#4f8a63', dark: '#e9efe6', pot: '#9fb59a', rim: '#869c81', tint: '#eaf0ea', rating: 4.8, reviews: 143},
];
const byId = id => PLANTS.find(p => p.id === id);
const CATS = ['All', 'Indoor', 'Low light', 'Succulents', 'Pet friendly'];

function plantSvg(p, cls) {
  const g = [];
  const leaf = (tx, ty, rot, s, fill, extra) =>
    '<g transform="translate(' + tx + ' ' + ty + ') rotate(' + rot + ') scale(' + s + ')">' + extra(fill) + '</g>';
  if (p.kind === 'split') {
    const shape = f => '<path d="M0 0C-17-9-21-38 0-50C21-38 17-9 0 0z" fill="' + f + '"/>'
      + '<path d="M0-3V-46" stroke="' + p.dark + '" stroke-width="1.5"/>'
      + '<path d="M0-16l-13-5M0-27l13-6M0-36l-11-6M0-22l12-3" stroke="' + p.tint + '" stroke-width="2.4" stroke-linecap="round"/>';
    g.push(leaf(60, 76, -58, .9, p.dark, shape), leaf(60, 76, 52, .85, p.dark, shape),
           leaf(60, 76, -22, 1.05, p.leaf, shape), leaf(60, 76, 18, 1, p.leaf, shape));
  } else if (p.kind === 'tall') {
    const shape = f => '<path d="M0 0C-8-20-7-50 0-64C7-50 8-20 0 0z" fill="' + f + '" stroke="' + p.dark + '" stroke-width="1.6"/>'
      + '<path d="M-2-14h4M-3-28h5M-2-42h4" stroke="#9fc7a8" stroke-width="1.4" stroke-linecap="round"/>';
    [[-22, 52, .8], [22, 68, .85], [-9, 56, 1], [10, 63, .95], [0, 60, 1.08]].forEach(([r, x, s]) =>
      g.push(leaf(x, 78, r, s, p.leaf, shape)));
  } else if (p.kind === 'round') {
    g.push('<path d="M60 78C59 60 61 44 60 26" stroke="#5b4636" stroke-width="2.5" fill="none" stroke-linecap="round"/>');
    const shape = f => '<ellipse cx="15" cy="0" rx="15" ry="10.5" fill="' + f + '"/><path d="M1 0H27" stroke="' + p.dark + '" stroke-width="1.2"/>';
    [[70, -32, .9, p.dark], [62, 212, .95, p.leaf], [54, -28, 1.05, p.leaf], [46, 205, 1, p.dark],
     [38, -35, 1, p.leaf], [30, 210, .9, p.leaf], [25, -70, .8, p.dark]].forEach(([y, r, s, f]) =>
      g.push(leaf(60, y, r, s, f, shape)));
  } else if (p.kind === 'trail') {
    g.push('<path d="M48 76C34 82 30 96 26 108M72 76C86 84 90 96 96 106M60 74C58 60 52 50 46 44M60 74C64 60 70 52 78 46"'
      + ' stroke="#5d7f3a" stroke-width="2" fill="none" stroke-linecap="round"/>');
    const shape = f => '<path d="M0 0C-9-3-12-13-5-17C-2-19 0-16 0-14C0-16 2-19 5-17C12-13 9-3 0 0z" fill="' + f + '"/>'
      + '<path d="M0-1V-13" stroke="' + p.dark + '" stroke-width="1.3"/>';
    [[30, 100, 200, .9], [36, 88, 210, 1], [44, 79, 185, .95], [92, 100, 160, .9], [84, 88, 150, 1],
     [76, 80, 175, .95], [46, 46, -40, .9], [52, 58, -20, 1], [78, 48, 40, .9], [68, 60, 20, 1], [60, 66, 0, 1.05]]
      .forEach(([x, y, r, s], i) => g.push(leaf(x, y, r, s, i % 3 ? p.leaf : '#77b257', shape)));
  } else if (p.kind === 'rosette') {
    const ring = (n, len, w, fill, off) => {
      for (let i = 0; i < n; i++) g.push('<ellipse cx="0" cy="' + (-len) + '" rx="' + w + '" ry="' + len
        + '" fill="' + fill + '" transform="translate(60 66) rotate(' + (i * 360 / n + off) + ')"/>');
    };
    ring(10, 15, 7, p.leaf, 0);
    ring(8, 11, 6, p.kind === 'rosette' && p.id === 'haworthia' ? '#3f7553' : '#b3d3c4', 22);
    ring(6, 7, 4.5, p.dark, 8);
    if (p.id === 'haworthia') {
      for (let i = 0; i < 10; i++) g.push('<path d="M0-6v-16" stroke="#e9efe6" stroke-width="1.4" stroke-dasharray="1.5 3" '
        + 'transform="translate(60 66) rotate(' + (i * 36) + ')"/>');
    }
  } else if (p.kind === 'zz') {
    const shape = f => {
      let s = '<path d="M0 0C-1-22 1-44 0-60" stroke="' + p.dark + '" stroke-width="2.2" fill="none"/>';
      for (let i = 0; i < 5; i++) {
        const y = -14 - i * 10;
        s += '<ellipse cx="-7" cy="' + y + '" rx="7" ry="4" fill="' + f + '" transform="rotate(25 0 ' + y + ')"/>'
           + '<ellipse cx="7" cy="' + (y - 3) + '" rx="7" ry="4" fill="' + f + '" transform="rotate(-25 0 ' + (y - 3) + ')"/>';
      }
      return s;
    };
    g.push(leaf(56, 78, -18, .9, p.dark, shape), leaf(64, 78, 16, .95, p.leaf, shape), leaf(60, 78, 0, 1.05, p.leaf, shape));
  }
  const pot = '<path d="M39 80h42l-5 29a4 4 0 0 1-4 3.4H48a4 4 0 0 1-4-3.4z" fill="' + p.pot + '"/>'
            + '<rect x="35" y="74" width="50" height="9" rx="3" fill="' + p.rim + '"/>';
  return '<svg class="plant ' + (cls || '') + '" viewBox="0 0 120 120" aria-hidden="true">'
    + '<ellipse cx="60" cy="114" rx="30" ry="3.5" fill="rgba(0,0,0,.08)"/>'
    + (p.kind === 'trail' ? pot + g.join('') : g.join('') + pot) + '</svg>';
}

/* ---------- state ---------- */
const S = {cat: 'All', q: '', cart: {}, saved: new Set(['calathea']), qty: 1,
           slot: 0, promo: null, promoMsg: null, placing: false, order: null};
const SLOTS = [['Tomorrow', '9am to 1pm'], ['Tomorrow', '4pm to 8pm'], ['Thu, 9 Oct', 'All day']];

const count = () => Object.values(S.cart).reduce((a, b) => a + b, 0);
function totals() {
  const sub = Object.entries(S.cart).reduce((a, [id, q]) => a + byId(id).price * q, 0);
  const delivery = sub === 0 || sub >= 999 ? 0 : 79;
  const discount = S.promo ? Math.round(sub * 0.1) : 0;
  const total = sub + delivery - discount;
  return {sub, delivery, discount, total, gst: Math.round(total * 18 / 118)};  // prices include 18% GST
}
function syncBadges() {
  const n = count();
  document.querySelectorAll('[data-count]').forEach(b => { b.textContent = n; b.hidden = !n; });
}
function addToCart(id, q) {
  S.cart[id] = (S.cart[id] || 0) + q;
  syncBadges();
}
function toggleSave(id) {
  if (S.saved.has(id)) { S.saved.delete(id); Kit.toast('Removed from saved'); }
  else { S.saved.add(id); Kit.toast('Saved for later'); }
}

/* ---------- home ---------- */
function renderChips() {
  document.getElementById('chips').innerHTML = CATS.map(c =>
    '<button class="chip' + (c === S.cat ? ' on' : '') + '" data-rl="home.category-chip" data-cat="' + esc(c) + '">'
    + esc(c) + '</button>').join('');
}
function renderGrid() {
  const q = S.q.trim().toLowerCase();
  const list = PLANTS.filter(p => (S.cat === 'All' || p.tags.includes(S.cat))
    && (!q || p.name.toLowerCase().includes(q) || p.latin.toLowerCase().includes(q)));
  document.getElementById('grid-title').textContent = S.cat === 'All' ? 'Popular plants' : S.cat;
  document.getElementById('grid-count').textContent = list.length + (list.length === 1 ? ' plant' : ' plants');
  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.style.display = 'block';
    grid.innerHTML = '<div class="empty" data-rl="home.empty">' + plantSvg(byId('echeveria'))
      + '<h3>No plants match "' + esc(S.q) + '"</h3><p class="muted">Try another name, or browse a category.</p>'
      + '<button class="btn ghost" data-rl="home.clear-search" id="clear-q">Clear search</button></div>';
    return;
  }
  grid.style.display = '';
  grid.innerHTML = list.map(p =>
    '<div class="card" data-rl="home.product-card" data-open="' + p.id + '">'
    + '<div class="art" style="background:' + p.tint + '">' + plantSvg(p)
    + '<button class="heart' + (S.saved.has(p.id) ? ' on' : '') + '" data-rl="home.save-button" data-save="' + p.id
    + '" aria-label="Save">' + I.heart + '</button></div>'
    + '<div class="name">' + esc(p.name) + '</div><div class="sub muted">' + esc(p.tags.join(' · ')) + '</div>'
    + '<div class="foot"><span class="price">' + money(p.price) + '</span>'
    + '<button class="add" data-rl="home.quick-add" data-add="' + p.id + '" aria-label="Add to bag">' + I.plus
    + '</button></div></div>').join('');
}
Kit.screen('home', () => { renderChips(); renderGrid(); });

document.getElementById('q').addEventListener('input', e => { S.q = e.target.value; renderGrid(); });
document.getElementById('featured-cta').onclick = () => { S.cat = 'Low light'; renderChips(); renderGrid();
  document.getElementById('grid-title').scrollIntoView({behavior: 'smooth'}); };
document.getElementById('featured-art').innerHTML = plantSvg(byId('snake')).replace(/^<svg[^>]*>|<\/svg>$/g, '');

document.querySelector('[data-rl-screen="home"]').addEventListener('click', e => {
  const t = e.target;
  const cat = t.closest('[data-cat]');
  if (cat) { S.cat = cat.dataset.cat; renderChips(); renderGrid(); return; }
  if (t.closest('#clear-q')) { S.q = ''; document.getElementById('q').value = ''; renderGrid(); return; }
  const save = t.closest('[data-save]');
  if (save) { toggleSave(save.dataset.save); renderGrid(); return; }
  const add = t.closest('[data-add]');
  if (add) { const p = byId(add.dataset.add); addToCart(p.id, 1); Kit.toast(p.name + ' added to your bag'); return; }
  const open = t.closest('[data-open]');
  if (open) { S.qty = 1; Kit.go('product/' + open.dataset.open); }
});

/* ---------- product ---------- */
Kit.screen('product', (el, params) => {
  const p = byId(params[0]) || PLANTS[0];
  el.innerHTML =
    '<div class="p-top"><button class="icon-btn" data-back data-rl="product.back" aria-label="Back">' + I.back + '</button>'
    + '<button class="icon-btn heart' + (S.saved.has(p.id) ? ' on' : '') + '" data-rl="product.save" id="p-save" aria-label="Save">'
    + I.heart + '</button></div>'
    + '<div class="p-hero" data-rl="product.hero" style="background:' + p.tint + '">' + plantSvg(p) + '</div>'
    + '<div class="row between p-name"><div><div class="h1" data-rl="product.name">' + esc(p.name) + '</div>'
    + '<div class="latin muted">' + esc(p.latin) + '</div></div>'
    + '<div class="h1 price" data-rl="product.price">' + money(p.price) + '</div></div>'
    + '<div class="stars" data-rl="product.rating">' + I.star + '<b>' + p.rating + '</b><span class="muted">'
    + p.reviews + ' reviews</span></div>'
    + '<div class="care" data-rl="product.care">'
    + '<div data-rl="product.care-light">' + I.sun + '<b>Light</b><span>' + esc(p.light) + '</span></div>'
    + '<div data-rl="product.care-water">' + I.drop + '<b>Water</b><span>' + esc(p.water) + '</span></div>'
    + '<div data-rl="product.care-size">' + I.ruler + '<b>Size</b><span>' + esc(p.size) + '</span></div>'
    + '<div data-rl="product.care-pets">' + I.paw + '<b>Pets</b><span>' + (p.pet ? 'Safe' : 'Keep away') + '</span></div></div>'
    + '<p class="desc" data-rl="product.description">' + esc(p.name) + ' arrives rooted in a breathable nursery pot, '
    + 'inside the ceramic pot shown. It settles in within a week; keep it out of harsh afternoon sun and let the top '
    + 'few centimetres of soil dry out between waterings.</p>';
  const bar = document.getElementById('bottom');
  bar.innerHTML = '<div class="buybar" data-rl="product.buy-bar">'
    + '<div class="stepper" data-rl="product.qty"><button id="q-minus" aria-label="Less">' + I.minus + '</button>'
    + '<span id="q-n">' + S.qty + '</span><button id="q-plus" aria-label="More">' + I.plus + '</button></div>'
    + '<button class="btn" data-rl="product.add-to-bag" id="p-add">Add to bag, ' + money(p.price * S.qty) + '</button></div>';
  const sync = () => { document.getElementById('q-n').textContent = S.qty;
    document.getElementById('p-add').textContent = 'Add to bag, ' + money(p.price * S.qty); };
  document.getElementById('q-minus').onclick = () => { S.qty = Math.max(1, S.qty - 1); sync(); };
  document.getElementById('q-plus').onclick = () => { S.qty = Math.min(9, S.qty + 1); sync(); };
  document.getElementById('p-save').onclick = e => { toggleSave(p.id); e.currentTarget.classList.toggle('on', S.saved.has(p.id)); };
  document.getElementById('p-add').onclick = () => {
    addToCart(p.id, S.qty);
    Kit.sheet({
      id: 'product.added-sheet', title: 'Added to your bag',
      html: '<div class="line" style="border:0;padding:0"><div class="thumb" style="background:' + p.tint + '">'
        + plantSvg(p) + '</div><div class="info"><b>' + esc(p.name) + '</b><span class="muted">' + S.qty + ' x '
        + money(p.price) + '</span></div></div>',
      actions: [{label: 'Keep shopping', id: 'product.keep-shopping', onClick: () => Kit.go('home')},
                {label: 'View bag', primary: true, id: 'product.view-bag', onClick: () => Kit.go('cart')}],
    });
  };
});

/* ---------- saved ---------- */
Kit.screen('saved', el => {
  const list = PLANTS.filter(p => S.saved.has(p.id));
  el.innerHTML = '<div class="h1">Saved</div><div class="muted">Plants you are thinking about.</div>'
    + (list.length ? '<div class="list">' + list.map(p =>
      '<div class="line" data-rl="saved.item" data-open="' + p.id + '"><div class="thumb" style="background:' + p.tint + '">'
      + plantSvg(p) + '</div><div class="info"><b>' + esc(p.name) + '</b><span class="price">' + money(p.price)
      + '</span></div><button class="add" data-rl="saved.add" data-add="' + p.id + '" aria-label="Add to bag">' + I.plus
      + '</button></div>').join('') + '</div>'
    : '<div class="empty" data-rl="saved.empty">' + plantSvg(byId('pothos'))
      + '<h3>Nothing saved yet</h3><p class="muted">Tap the heart on any plant to keep it here.</p>'
      + '<button class="btn" data-go="home" data-rl="saved.browse">Browse plants</button></div>');
});
document.querySelector('[data-rl-screen="saved"]').addEventListener('click', e => {
  const add = e.target.closest('[data-add]');
  if (add) { const p = byId(add.dataset.add); addToCart(p.id, 1); Kit.toast(p.name + ' added to your bag'); return; }
  const open = e.target.closest('[data-open]');
  if (open) { S.qty = 1; Kit.go('product/' + open.dataset.open); }
});

/* ---------- bag ---------- */
Kit.screen('cart', el => {
  const forcedEmpty = Kit.state() === 'empty';
  const lines = forcedEmpty ? [] : Object.entries(S.cart).filter(([, q]) => q > 0);
  const bar = document.getElementById('bottom');
  if (!lines.length) {
    bar.innerHTML = '';
    el.innerHTML = '<div class="h1">Your bag</div><div class="empty" data-rl="cart.empty">' + plantSvg(byId('monstera'))
      + '<h3>Your bag is empty</h3><p class="muted">Plants you add will wait here.</p>'
      + '<button class="btn" data-go="home" data-rl="cart.start-shopping">Start shopping</button></div>';
    return;
  }
  const t = totals();
  el.innerHTML = '<div class="row between"><div class="h1">Your bag</div><span class="muted">' + count() + ' items</span></div>'
    + '<div class="list">' + lines.map(([id, q]) => { const p = byId(id); return (
      '<div class="line" data-rl="cart.line-item"><div class="thumb" style="background:' + p.tint + '">' + plantSvg(p) + '</div>'
      + '<div class="info"><b>' + esc(p.name) + '</b><span class="price">' + money(p.price * q) + '</span>'
      + '<div class="stepper small" data-rl="cart.qty" style="margin-top:6px;width:max-content">'
      + '<button data-dec="' + id + '" aria-label="Less">' + I.minus + '</button><span>' + q + '</span>'
      + '<button data-inc="' + id + '" aria-label="More">' + I.plus + '</button></div></div>'
      + '<button class="rm" data-rm="' + id + '" data-rl="cart.remove" aria-label="Remove">' + I.trash + '</button></div>'); }).join('')
    + '</div>'
    + '<div class="box" data-rl="cart.delivery"><h4>Delivery slot</h4><div class="slots">' + SLOTS.map((s, i) =>
      '<button class="slot' + (i === S.slot ? ' on' : '') + '" data-slot="' + i + '"><b>' + s[0] + '</b>' + s[1] + '</button>').join('')
    + '</div></div>'
    + '<div class="box" data-rl="cart.promo"><h4>Promo code</h4><div class="promo"><input id="promo" placeholder="Try SPROUT10" value="'
    + esc(S.promo || '') + '"><button id="apply" data-rl="cart.apply-promo">Apply</button></div>'
    + (S.promoMsg ? '<div class="promo-msg ' + S.promoMsg[0] + '">' + esc(S.promoMsg[1]) + '</div>' : '') + '</div>'
    + '<div class="box sum" data-rl="cart.summary"><div data-rl="cart.subtotal"><span class="muted">Subtotal</span><span>' + money(t.sub) + '</span></div>'
    + '<div data-rl="cart.delivery-fee"><span class="muted">Delivery</span><span>' + (t.delivery ? money(t.delivery) : 'Free') + '</span></div>'
    + (t.discount ? '<div data-rl="cart.discount"><span class="muted">SPROUT10</span><span style="color:var(--green)">-' + money(t.discount) + '</span></div>' : '')
    + '<div class="total" data-rl="cart.total"><span>Total <small class="muted" style="font-weight:500;font-size:12px">incl. GST</small></span><span>' + money(t.total) + '</span></div>'
    + '<div class="gst" data-rl="cart.gst"><span>Includes GST (18%)</span><span>' + money(t.gst) + '</span></div></div>';
  bar.innerHTML = '<div class="checkout"><button class="btn" data-rl="cart.checkout-button" id="place">'
    + (S.placing ? '<span class="spin"></span>Placing order' : 'Place order, ' + money(t.total)) + '</button></div>';
  document.getElementById('place').disabled = S.placing;
  document.getElementById('place').onclick = async () => {
    S.placing = true; Kit.refresh();
    await Kit.delay(900);
    S.order = {id: 'SPR-' + fake.int(40000, 49999), items: count(), total: totals().total, slot: SLOTS[S.slot]};
    S.placing = false; S.cart = {}; S.promo = null; S.promoMsg = null; syncBadges();
    Kit.go('done');
  };
  document.getElementById('apply').onclick = () => {
    const code = document.getElementById('promo').value.trim().toUpperCase();
    if (code === 'SPROUT10') { S.promo = code; S.promoMsg = ['ok', '10% off applied']; }
    else { S.promo = null; S.promoMsg = ['err', code ? 'That code is not valid' : 'Enter a code first']; }
    Kit.refresh();
  };
});
document.querySelector('[data-rl-screen="cart"]').addEventListener('click', e => {
  const inc = e.target.closest('[data-inc]'), dec = e.target.closest('[data-dec]');
  const rm = e.target.closest('[data-rm]'), slot = e.target.closest('[data-slot]');
  if (inc) S.cart[inc.dataset.inc] = Math.min(9, S.cart[inc.dataset.inc] + 1);
  else if (dec) S.cart[dec.dataset.dec] = Math.max(1, S.cart[dec.dataset.dec] - 1);
  else if (rm) { const p = byId(rm.dataset.rm); delete S.cart[rm.dataset.rm]; Kit.toast(p.name + ' removed'); }
  else if (slot) S.slot = +slot.dataset.slot;
  else return;
  syncBadges(); Kit.refresh();
});

/* ---------- done ---------- */
Kit.screen('done', el => {
  document.getElementById('bottom').innerHTML = '';
  const o = S.order || {id: 'SPR-41872', items: 2, total: 1748, slot: SLOTS[0]};
  el.innerHTML = '<div class="done" data-rl="done.confirmation"><div class="tick">' + I.check + '</div>'
    + '<div class="h1">Order placed</div><p class="muted" style="margin-top:6px">Your plants are being packed with care.</p></div>'
    + '<div class="box receipt" data-rl="done.receipt"><div data-rl="done.order-id"><span class="muted">Order</span><b>' + o.id + '</b></div>'
    + '<div data-rl="done.arriving"><span class="muted">Arriving</span><b>' + o.slot[0] + ', ' + o.slot[1] + '</b></div>'
    + '<div data-rl="done.items"><span class="muted">Items</span><b>' + o.items + '</b></div>'
    + '<div data-rl="done.paid"><span class="muted">Paid, incl. GST</span><b>' + money(o.total) + '</b></div></div>'
    + '<button class="btn" data-rl="done.track" id="track">Track order</button>'
    + '<button class="btn ghost" style="margin-top:10px" data-go="home" data-rl="done.back-to-shop">Back to shop</button>';
  document.getElementById('track').onclick = () => Kit.modal({
    id: 'done.tracking-modal', title: 'Live tracking',
    html: '<p class="muted">Tracking is not part of this prototype yet. It would show the courier on a map with a live ETA.</p>',
    actions: [{label: 'Got it', primary: true}],
  });
});

/* ---------- chrome ---------- */
Kit.on('route', r => {
  const tabs = ['home', 'saved', 'cart'];
  document.getElementById('tabbar').hidden = !tabs.includes(r.name);
  document.querySelectorAll('[data-tab]').forEach(t => t.classList.toggle('on', t.dataset.tab === r.name));
  if (r.name !== 'product' && r.name !== 'cart' && r.name !== 'done') document.getElementById('bottom').innerHTML = '';
});

S.cart = {snake: 1, echeveria: 2};
syncBadges();
Kit.start({home: 'home'});
</script>
</body>
</html>
